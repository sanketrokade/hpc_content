name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers and MPI
        run: sudo apt-get update && sudo apt-get install -y build-essential openmpi-bin libopenmpi-dev
      - name: Environment report
        run: scripts/check-env.sh
      - name: Build all examples
        run: make -j"$(nproc)"
      - name: Smoke test
        run: |
          cd mpi/day10-mpi-intro && ../../scripts/compile.sh hello.c && ../../scripts/run.sh ./hello.out 4
